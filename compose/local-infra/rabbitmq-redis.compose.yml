version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: comic2video_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7.2
    container_name: comic2video_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
