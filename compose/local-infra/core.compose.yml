version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: comic2video_rabbitmq
    restart: unless-stopped
    ports:
      - "25672:5672"
      - "25673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7.2
    container_name: comic2video_redis
    restart: unless-stopped
    ports:
      - "26379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: comic2video_minio
    restart: unless-stopped
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: comic2video_minio
      MINIO_ROOT_PASSWORD: comic2video_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - comic2video_minio_data:/data

  minio_init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: comic2video_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until /usr/bin/mc alias set local http://minio:9000 comic2video_minio comic2video_minio_secret; do
        echo "waiting for minio...";
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/comic2video;
      /usr/bin/mc anonymous set private local/comic2video;
      exit 0;
      '

volumes:
  comic2video_minio_data:
