version: '3.8'

services:
  script_provider:
    image: ${SCRIPT_IMAGE}
    container_name: ${SCRIPT_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${SCRIPT_HOST_BIND}:${SCRIPT_PORT}:8000"
    ipc: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${MODEL_DATA_ROOT}:${MODEL_DATA_ROOT}
      - ${MODEL_LOG_ROOT}:${MODEL_LOG_ROOT}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: >
      bash -lc "vllm serve ${SCRIPT_MODEL_PATH}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${SCRIPT_MODEL_NAME}
      --gpu-memory-utilization ${SCRIPT_GPU_MEMORY_UTILIZATION}
      --max-model-len ${SCRIPT_MAX_MODEL_LEN}
      --tensor-parallel-size ${SCRIPT_TENSOR_PARALLEL_SIZE}
      ${SCRIPT_EXTRA_ARGS}"
